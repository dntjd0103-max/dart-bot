name: DART Auto Bot

on:
  schedule:
    # 매일 한국 시간 오후 5시 (영국 UTC 기준 08:00) 자동 실행
    - cron: '0 8 * * *'
  workflow_dispatch: # 버튼을 눌러 직접 수동 실행 가능하도록 설정

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: pip install requests

      - name: 파이썬 코드 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
