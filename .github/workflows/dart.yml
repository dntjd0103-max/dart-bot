name: DART 내부자 매수 알림

on:
  schedule:
    - cron: "17 10 * * 1-5"   # 평일 한국시간 19:17 (그날 공시가 거의 다 올라온 뒤)
  workflow_dispatch:          # Actions 탭에서 직접 실행 가능
    inputs:
      date:
        description: "날짜 (YYYYMMDD, 비우면 오늘)"
        required: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}"
          else
            python main.py
          fi
      - name: Save log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update alerts log"
          git push
